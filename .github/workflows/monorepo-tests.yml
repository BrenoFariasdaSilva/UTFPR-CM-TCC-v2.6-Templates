name: Monorepo template checks

on:
  push:
    paths:
      - 'UTFPR-CM-TCC-v2.6-Docker/**'
      - 'UTFPR-CM-TCC-v2.6-English-Docker/**'
      - 'UTFPR-CM-TCC-v2.6-English-Local/**'
      - 'UTFPR-CM-TCC-v2.6-Local/**'
      - '.github/workflows/monorepo-tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        project:
          - UTFPR-CM-TCC-v2.6-Docker
          - UTFPR-CM-TCC-v2.6-English-Docker
          - UTFPR-CM-TCC-v2.6-English-Local
          - UTFPR-CM-TCC-v2.6-Local
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python, JSON, and unit tests
        run: |
          python -m compileall -q scripts tests
          python -m json.tool build-config.json
          python -m unittest discover -s tests -v
      - name: Check POSIX launcher syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n Start-Here-Linux.sh
          bash -n Start-Here-macOS.command
